name: Bug report
description: Report an issue using redacted logs and synthetic examples.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Proxmox version, filesystem, browser, project revision
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Do not attach runtime config.json, tokens, passwords, private keys, or backup contents.
      render: text
