# Minimal fixed-height widget. For automatic sizing, use the document.head from glance.yml.
- type: html
  source: |
    <section class="widget" aria-label="Proxmox USB backups">
      <iframe src="${PROXMOX_BACKUP_URL}" title="Proxmox USB backup panel"
        style="width:100%;height:1200px;border:0;display:block;border-radius:12px;"
        loading="lazy" referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </section>
